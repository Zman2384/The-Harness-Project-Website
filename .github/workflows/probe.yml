name: probe
on:
  push:
    branches: [claude/site-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
          for h in theharnessproject.org www.theharnessproject.org harnessproject.pages.dev; do
            echo "DNS $h A=[$(dig +short $h A | tr '\n' ' ')] CNAME=[$(dig +short $h CNAME | tr '\n' ' ')]"
          done
          echo "NS=[$(dig +short NS theharnessproject.org | tr '\n' ' ')]"
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          for u in https://www.theharnessproject.org/ https://www.theharnessproject.org/robots.txt https://theharnessproject.org/robots.txt; do
            st=$(curl -sS -m 20 -A "$UA" -o /tmp/b -D /tmp/h -w '%{http_code} %{redirect_url}' "$u" 2>&1)
            echo "URL $u -> $st | $(grep -i '^\(server\|location\|cf-mitigated\|content-type\)' /tmp/h | tr -d '\r' | tr '\n' ' ') | title: $(grep -o '<title>[^<]*' /tmp/b | head -1)"
          done
          } > out.txt
          python3 - <<'PY'
          import urllib.parse
          s=open('out.txt').read()
          for chunk in [s[i:i+3500] for i in range(0,len(s),3500)]:
              print('::warning::'+chunk.replace('%','%25').replace('\n','%0A'))
          PY
