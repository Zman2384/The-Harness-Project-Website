name: Update sitemap dates
on:
  push:
    branches: [main]
    paths-ignore: [sitemap.xml]
permissions:
  contents: write
jobs:
  lastmod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/update_sitemap.py
      - name: Commit if changed
        run: |
          git diff --quiet sitemap.xml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update sitemap lastmod dates"
          git push
